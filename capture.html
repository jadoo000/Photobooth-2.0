<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Take Your Photos</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="capture-page">


    <!-- FLASH EFFECT -->

    <div
        id="cameraFlash"
        class="camera-flash"
    ></div>



    <main class="capture-container">


        <!-- HEADER -->

        <header class="capture-header">

            <button
                class="back-button"
                onclick="goBackHome()"
            >
                ← Back
            </button>


            <div>

                <h1>TAKE A PIC</h1>

                <p id="photoCounter">
                    Ready?
                </p>

            </div>

        </header>



        <!-- CAMERA + PREVIEW -->

        <section class="camera-layout">


            <!-- CAMERA -->

            <div class="camera-section">

                <div class="camera-frame">


                    <!-- LIVE CAMERA -->

                    <video
                        id="cameraVideo"
                        autoplay
                        playsinline
                        muted
                    ></video>


                    <!-- CAMERA PLACEHOLDER -->

                    <div
                        id="cameraPlaceholder"
                        class="camera-placeholder"
                    >

                        <div class="camera-icon">
                            📷
                        </div>

                        <p>
                            Open your camera to begin
                        </p>

                    </div>


                    <!-- COUNTDOWN -->

                    <div
                        id="countdown"
                        class="countdown"
                    ></div>

                </div>



                <!-- CAMERA CONTROLS -->

                <div class="camera-controls">


                    <button
                        class="secondary-button"
                        onclick="startCamera()"
                    >
                        OPEN CAMERA
                    </button>


                    <button
                        id="captureButton"
                        class="shutter-button"
                        onclick="capturePhoto()"
                        disabled
                    >

                        <span></span>

                    </button>


                    <button
                        class="secondary-button"
                        onclick="switchCamera()"
                    >
                        🔄 SWITCH
                    </button>


                </div>

            </div>



            <!-- PHOTO PREVIEW -->

            <aside class="preview-section">

                <h2>
                    YOUR PHOTO STRIP
                </h2>


                <!--
                    JavaScript will create
                    the selected layout here.
                -->

                <div
                    id="photoPreview"
                    class="photo-preview"
                ></div>


            </aside>


        </section>



        <!-- FINISH -->

        <button
            id="finishButton"
            class="main-button"
            onclick="finishPhotos()"
            disabled
        >
            FINISH PHOTO
        </button>


    </main>



    <script src="script.js"></script>

</body>

</html>
