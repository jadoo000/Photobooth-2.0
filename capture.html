<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Take Your Photos</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="capture-page">


    <!-- ========================================
         CAMERA FLASH
    ========================================= -->

    <div
        id="cameraFlash"
        class="camera-flash"
    ></div>



    <main class="capture-container">


        <!-- ========================================
             HEADER
        ========================================= -->

        <header class="capture-header">


            <button
                class="back-button"
                onclick="goBackHome()"
            >
                ← Back
            </button>


            <div>

                <h1>
                    TAKE A PIC
                </h1>


                <p id="photoCounter">
                    Ready?
                </p>

            </div>


        </header>



        <!-- ========================================
             MAIN CAMERA AREA
        ========================================= -->

        <section class="camera-layout">


            <!-- ====================================
                 CAMERA
            ===================================== -->

            <div class="camera-section">


                <div class="camera-frame">


                    <!-- LIVE CAMERA -->

                    <video
                        id="cameraVideo"
                        autoplay
                        playsinline
                        muted
                    ></video>


                    <!-- CAMERA PLACEHOLDER -->

                    <div
                        id="cameraPlaceholder"
                        class="camera-placeholder"
                    >

                        <div class="camera-icon">
                            📷
                        </div>


                        <p>
                            Open your camera to begin
                        </p>

                    </div>


                    <!-- COUNTDOWN -->

                    <div
                        id="countdown"
                        class="countdown"
                    ></div>


                </div>



                <!-- ====================================
                     FILTER SELECTOR
                ===================================== -->

                <div class="filter-section">


                    <h3>
                        CHOOSE YOUR FILTER
                    </h3>


                    <div
                        id="filterOptions"
                        class="filter-options"
                    >


                        <!-- NORMAL -->

                        <button
                            class="filter-option active"
                            data-filter="normal"
                            onclick="selectFilter('normal')"
                        >

                            <div
                                class="filter-preview filter-normal"
                            ></div>

                            <span>
                                Normal
                            </span>

                        </button>



                        <!-- VINTAGE -->

                        <button
                            class="filter-option"
                            data-filter="vintage"
                            onclick="selectFilter('vintage')"
                        >

                            <div
                                class="filter-preview filter-vintage"
                            ></div>

                            <span>
                                Vintage
                            </span>

                        </button>



                        <!-- BLACK AND WHITE -->

                        <button
                            class="filter-option"
                            data-filter="bw"
                            onclick="selectFilter('bw')"
                        >

                            <div
                                class="filter-preview filter-bw"
                            ></div>

                            <span>
                                B&W
                            </span>

                        </button>



                        <!-- SEPIA -->

                        <button
                            class="filter-option"
                            data-filter="sepia"
                            onclick="selectFilter('sepia')"
                        >

                            <div
                                class="filter-preview filter-sepia"
                            ></div>

                            <span>
                                Sepia
                            </span>

                        </button>



                        <!-- COOL -->

                        <button
                            class="filter-option"
                            data-filter="cool"
                            onclick="selectFilter('cool')"
                        >

                            <div
                                class="filter-preview filter-cool"
                            ></div>

                            <span>
                                Cool
                            </span>

                        </button>



                        <!-- WARM -->

                        <button
                            class="filter-option"
                            data-filter="warm"
                            onclick="selectFilter('warm')"
                        >

                            <div
                                class="filter-preview filter-warm"
                            ></div>

                            <span>
                                Warm
                            </span>

                        </button>


                    </div>


                </div>



                <!-- ====================================
                     CAMERA CONTROLS
                ===================================== -->

                <div class="camera-controls">

<button
    id="cameraToggleButton"
    class="secondary-button"
    onclick="startCamera()"
>
    OPEN CAMERA
</button>



                    <button
                        id="captureButton"
                        class="shutter-button"
                        onclick="capturePhoto()"
                        disabled
                    >

                        <span></span>

                    </button>



                    <button
                        class="secondary-button"
                        onclick="switchCamera()"
                    >
                        🔄 SWITCH
                    </button>


                </div>


            </div>



            <!-- ====================================
                 PHOTO PREVIEW
            ===================================== -->

            <aside class="preview-section">


                <h2>
                    YOUR PHOTO STRIP
                </h2>


                <div
                    id="photoPreview"
                    class="photo-preview"
                ></div>


            </aside>


        </section>



        <!-- ========================================
             FINISH
        ========================================= -->

        <button
            id="finishButton"
            class="main-button"
            onclick="finishPhotos()"
            disabled
        >
            FINISH PHOTO
        </button>


    </main>



    <script src="script.js"></script>

</body>

</html>
