<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photo Booth</title>

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="home-page">

    <main class="home-container">


        <!-- ==========================================
             HERO
        =========================================== -->

        <header class="hero">

            <span class="hero-badge">

                PREMIUM PHOTO EXPERIENCE

            </span>

            <h1 class="hero-title">

                PHOTO<br>BOOTH

            </h1>

            <p class="hero-description">

                Every memory deserves a beautiful frame.

                Choose your favorite layout and create
                timeless photo strips with a premium,
                modern experience.

            </p>

        </header>



        <!-- ==========================================
             LAYOUTS
        =========================================== -->

        <section class="layout-section">

            <div class="section-heading">

                <h2>

                    Choose Your Layout

                </h2>

                <p>

                    Select the photo style that matches
                    your memories.

                </p>

            </div>



            <div class="layout-grid">


                <!-- ==================================
                     CLASSIC
                =================================== -->

                <div class="layout-card">

                    <button

                        class="layout-option selected"

                        data-layout="classic"

                        data-photos="3"

                        onclick="selectLayout(this)"

                    >

                        <div class="mini-strip classic-strip">

                            <div class="mini-photo"></div>

                            <div class="mini-photo"></div>

                            <div class="mini-photo"></div>

                            <div class="mini-label">

                                PHOTO BOOTH

                            </div>

                        </div>

                        <div class="layout-content">

                            <h3>

                                Classic Strip

                            </h3>

                            <p>

                                Three timeless portraits
                                in the traditional photo
                                booth format.

                            </p>

                        </div>

                    </button>

                </div>



                <!-- ==================================
                     FOUR PHOTOS
                =================================== -->

                <div class="layout-card">

                    <button

                        class="layout-option"

                        data-layout="four"

                        data-photos="4"

                        onclick="selectLayout(this)"

                    >

                        <div class="mini-strip four-strip">

                            <div class="mini-photo"></div>

                            <div class="mini-photo"></div>

                            <div class="mini-photo"></div>

                            <div class="mini-photo"></div>

                            <div class="mini-label">

                                PHOTO BOOTH

                            </div>

                        </div>

                        <div class="layout-content">

                            <h3>

                                Four Photos

                            </h3>

                            <p>

                                The iconic photo booth
                                experience with four
                                beautiful moments.

                            </p>

                        </div>

                    </button>

                </div>



                <!-- ==================================
                     GRID
                =================================== -->

                <div class="layout-card">

                    <button

                        class="layout-option"

                        data-layout="grid"

                        data-photos="4"

                        onclick="selectLayout(this)"

                    >

                        <div class="mini-grid">

                            <div class="mini-photo"></div>

                            <div class="mini-photo"></div>

                            <div class="mini-photo"></div>

                            <div class="mini-photo"></div>

                        </div>

                        <div class="layout-content">

                            <h3>

                                Photo Grid

                            </h3>

                            <p>

                                A clean modern collage
                                perfect for sharing.

                            </p>

                        </div>

                    </button>

                </div>


            </div>

        </section>



        <!-- ==========================================
             ACTION
        =========================================== -->

        <section class="home-action">

            <button

                class="main-button"

                onclick="startPhotoBooth()"

            >

                Start Experience →

            </button>

        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
