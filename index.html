<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photo Booth</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="home-page">

    <main class="home-container">


        <!-- =========================
             HERO
        ========================== -->

        <header class="hero">

            <span class="hero-badge">
                PREMIUM PHOTO EXPERIENCE
            </span>

            <h1 class="hero-title">
                PHOTO<br>BOOTH
            </h1>

            <p class="hero-description">
                Every memory deserves a beautiful frame.
                Choose a layout below and create timeless photo strips
                with a clean, premium experience.
            </p>

        </header>



        <!-- =========================
             LAYOUTS
        ========================== -->

        <section class="layout-section">

            <div class="section-heading">

                <h2>
                    Choose your layout
                </h2>

                <p>
                    Pick the style that best matches your memories.
                </p>

            </div>


            <div class="layout-grid">


                <!-- CLASSIC -->

                <button
                    class="layout-option selected"
                    data-layout="classic"
                    data-photos="3"
                    onclick="selectLayout(this)"
                >

                    <div class="mini-strip classic-strip">

                        <div class="mini-photo"></div>
                        <div class="mini-photo"></div>
                        <div class="mini-photo"></div>

                        <div class="mini-label">
                            PHOTO BOOTH
                        </div>

                    </div>

                    <h3>
                        Classic Strip
                    </h3>

                    <p>
                        Three timeless portraits.
                    </p>

                </button>



                <!-- FOUR -->

                <button
                    class="layout-option"
                    data-layout="four"
                    data-photos="4"
                    onclick="selectLayout(this)"
                >

                    <div class="mini-strip four-strip">

                        <div class="mini-photo"></div>
                        <div class="mini-photo"></div>
                        <div class="mini-photo"></div>
                        <div class="mini-photo"></div>

                        <div class="mini-label">
                            PHOTO BOOTH
                        </div>

                    </div>

                    <h3>
                        Four Photos
                    </h3>

                    <p>
                        The classic photo booth experience.
                    </p>

                </button>



                <!-- GRID -->

                <button
                    class="layout-option"
                    data-layout="grid"
                    data-photos="4"
                    onclick="selectLayout(this)"
                >

                    <div class="mini-grid">

                        <div class="mini-photo"></div>
                        <div class="mini-photo"></div>
                        <div class="mini-photo"></div>
                        <div class="mini-photo"></div>

                    </div>

                    <h3>
                        Photo Grid
                    </h3>

                    <p>
                        A modern square collage.
                    </p>

                </button>

            </div>

        </section>



        <!-- =========================
             START
        ========================== -->

        <div class="home-action">

            <button
                class="main-button"
                onclick="startPhotoBooth()"
            >

                Start Experience →

            </button>

        </div>


    </main>

    <script src="script.js"></script>

</body>

</html>
