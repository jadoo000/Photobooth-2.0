<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Photo</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="result-page">


    <main class="result-container">


        <header class="result-header">

            <h1>YOUR PHOTO</h1>

            <p>
                Your memories are ready!
            </p>

        </header>



        <section class="result-content">


            <!-- FINAL PHOTO -->

            <div class="final-photo-container">

                <canvas 
                    id="finalCanvas"
                ></canvas>

            </div>



            <!-- ACTIONS -->

            <div class="result-actions">

                <button 
                    class="main-button"
                    onclick="printPhoto()"
                >
                    PRINT PHOTO
                </button>


                <button 
                    class="secondary-button"
                    onclick="downloadPhoto()"
                >
                    DOWNLOAD
                </button>


                <button 
                    class="secondary-button"
                    onclick="retakePhotos()"
                >
                    RETAKE
                </button>

            </div>


        </section>


    </main>



    <!-- PRINTING MODAL -->

    <div 
        id="printModal"
        class="print-modal"
    >

        <div class="printer-container">


            <button 
                class="close-print"
                onclick="closePrint()"
            >
                ×
            </button>


            <h2>PHOTO BOOTH PRINTER</h2>


            <div class="printer-screen">

                <p id="printerStatus">
                    Ready to print
                </p>

            </div>


            <div class="printer">

                <div class="printer-top">

                    <div class="printer-light"></div>

                </div>


                <div class="printer-slot">

                    <div 
                        id="printedPhoto"
                        class="printed-photo"
                    >

                        <canvas 
                            id="printCanvas"
                        ></canvas>

                    </div>

                </div>

            </div>


            <button 
                id="startPrintButton"
                class="main-button"
                onclick="startPrinting()"
            >
                PRINT PHOTO
            </button>


        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>

</body>

</html>
